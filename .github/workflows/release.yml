name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        run: dotnet publish TinyHand.Windows/TinyHand.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - name: Publish Windows ARM64
        run: dotnet publish TinyHand.Windows/TinyHand.Windows.csproj --configuration Release --runtime win-arm64 --self-contained true -p:PublishSingleFile=true -o dist/win-arm64
      - name: Package downloads
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win-x64/* -DestinationPath TinyHand-Windows-x64.zip
          Compress-Archive -Path dist/win-arm64/* -DestinationPath TinyHand-Windows-ARM64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} TinyHand-Windows-x64.zip TinyHand-Windows-ARM64.zip --title ${{ github.ref_name }} --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-Windows
          path: TinyHand-Windows-*.zip
